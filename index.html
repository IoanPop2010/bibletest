<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2a24" />
    <meta
      name="description"
      content="A quiet morning Bible passage in English, one reading for each day."
    />
    <title>Morning Passage</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#passage">Skip to today’s reading</a>

    <div class="sky" aria-hidden="true"></div>

    <header class="top">
      <p class="eyebrow">Morning reading</p>
      <h1>Today’s passage</h1>
      <p class="date" id="date-label"></p>
    </header>

    <main id="passage" class="sheet" tabindex="-1">
      <div class="meta">
        <p class="theme" id="theme"></p>
        <h2 id="reference"></h2>
        <p class="translation">World English Bible · English</p>
      </div>

      <div class="status" id="status" role="status" aria-live="polite">Loading today’s reading…</div>
      <article class="verses" id="verses" hidden></article>

      <div class="toolbar">
        <button type="button" class="btn" id="listen-btn" aria-pressed="false">
          Listen
        </button>
        <button type="button" class="btn" id="copy-btn">Copy</button>
        <button type="button" class="btn primary" id="mark-btn">Mark as read</button>
      </div>

      <div class="controls" role="group" aria-label="Text size">
        <button type="button" class="icon-btn" id="smaller-btn" aria-label="Smaller text">A−</button>
        <button type="button" class="icon-btn" id="larger-btn" aria-label="Larger text">A+</button>
      </div>
    </main>

    <section class="footer-card" aria-label="Reading progress">
      <p id="streak">Open this page each morning. The passage follows the calendar day.</p>
      <p class="hint">Pasajul se schimbă o dată pe zi. Textul este în engleză, pentru lectură de dimineață.</p>
    </section>

    <script src="passages.js"></script>
    <script src="app.js"></script>
  </body>
</html>
